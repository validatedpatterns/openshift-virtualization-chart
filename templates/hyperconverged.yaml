# and an empty file will abort the edit. If an error occurs while saving this file will be
# reopened with the relevant failures.
#
apiVersion: hco.kubevirt.io/v1beta1
kind: HyperConverged
metadata:
  annotations:
    deployOVS: "false"
  {{- if not .Values.virtAutopilot.enabled }}
    # Skip all virt-autopilot managed configuration (OpenShift Virtualization >= 5.0).
    # Rules only match resources rendered by virt-autopilot itself. The kind
    # list mirrors the asset catalog of virt-platform-autopilot and may need
    # updating as new features are added there.
    platform.kubevirt.io/disabled-resources: |
      - kind: HyperConverged
        name: kubevirt-hyperconverged
      # Observability
      - kind: Service
        name: "*"
      - kind: ServiceMonitor
        name: "*"
      - kind: PrometheusRule
        name: "*"
      - kind: PersesDashboard
        name: "*"
      - kind: PersesDatasource
        name: "*"
      # Node tuning
      - kind: MachineConfig
        name: "*"
      - kind: MachineConfiguration
        name: "*"
      - kind: ConfigMap
        name: "*"
      # Operators and components
      - kind: KubeDescheduler
        name: "*"
      - kind: UIPlugin
        name: "*"
      - kind: OperationRuleSet
        name: "*"
      - kind: ForkliftController
        name: "*"
      - kind: MetalLB
        name: "*"
      - kind: LokiStack
        name: "*"
      - kind: ClusterLogForwarder
        name: "*"
      - kind: NodeHealthCheck
        name: "*"
      - kind: StorageBasedRemediationConfig
        name: "*"
      - kind: DaemonSet
        name: "*"
      # Supporting resources
      - kind: Namespace
        name: "*"
      - kind: ServiceAccount
        name: "*"
      - kind: ClusterRole
        name: "*"
      - kind: ClusterRoleBinding
        name: "*"
      - kind: SecurityContextConstraints
        name: "*"
      - kind: NetworkPolicy
        name: "*"
  {{- end }}
  finalizers:
  - kubevirt.io/hyperconverged
  labels:
    app: kubevirt-hyperconverged
  name: kubevirt-hyperconverged
  namespace: openshift-cnv
spec:
  {{- if .Values.cnv.debug.useEmulation }}
  configuration:
    developerConfiguration:
      useEmulation: true
  {{- end }}
  certConfig:
    ca:
      duration: 48h0m0s
      renewBefore: 24h0m0s
    server:
      duration: 24h0m0s
      renewBefore: 12h0m0s
{{- if semverCompare ">=4.19" .Values.global.clusterVersion }}
  enableCommonBootImageImport: {{ .Values.enableCommonBootImageImport }}
{{- end }}
  featureGates:
{{- if .Values.sriovLiveMigration }}
    sriovLiveMigration: true
{{- end }}
  infra: {}
  liveMigrationConfig:
    completionTimeoutPerGiB: 800
    parallelMigrationsPerCluster: 5
    parallelOutboundMigrationsPerNode: 2
    progressTimeout: 150
  uninstallStrategy: BlockUninstallIfWorkloadsExist
  workloadUpdateStrategy:
    batchEvictionInterval: 1m0s
    batchEvictionSize: 10
    workloadUpdateMethods:
    - LiveMigrate
  workloads: {}
